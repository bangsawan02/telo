# nixpacks.toml - Konfigurasi dependensi sistem untuk Puppeteer di Google Cloud Run
[phases.setup]
aptPkgs = [
  "chromium",
  "libnspr4",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libxshmfence1",
  "libgtk-3-0",
  "ca-certificates",
  "fonts-liberation",
  "procps",
  "xdg-utils",
  "wget"
]
